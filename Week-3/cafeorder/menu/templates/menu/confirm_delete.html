{% load humanize %}
<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ລຶບ {{ product.name }} - Cafe Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Noto Sans Lao', sans-serif; }
  </style>
</head>
<body class="bg-stone-100 min-h-screen text-stone-800">
  <header class="bg-gradient-to-br from-amber-900 to-stone-800 text-amber-50">
    <div class="max-w-xl mx-auto px-6 py-6">
      <a href="{% url 'product_detail' product.pk %}" class="text-sm text-amber-200 hover:text-white">← ກັບໄປໜ້າສິນຄ້າ</a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-6 py-8">
    <div class="rounded-2xl bg-white p-6 text-center shadow-sm ring-1 ring-rose-200 sm:p-8">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-rose-50 text-2xl">⚠️</div>
      <h1 class="mt-4 text-2xl font-bold">ລຶບສິນຄ້ານີ້ບໍ?</h1>
      <p class="mt-2 text-stone-600">
        <span class="font-semibold text-stone-800">{{ product.name }}</span>
        ({{ product.category.name }} · {{ product.price|intcomma }} ກີບ)
      </p>
      <p class="mt-1 text-sm text-rose-600">ລຶບແລ້ວຈະກູ້ຄືນບໍ່ໄດ້</p>

      <form method="post" class="mt-6 flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'product_detail' product.pk %}" class="rounded-full px-5 py-2 text-stone-600 ring-1 ring-stone-200 hover:bg-stone-100">ຍົກເລີກ</a>
        <button type="submit" class="rounded-full bg-rose-600 px-6 py-2 font-medium text-white hover:bg-rose-700">ຢືນຢັນລຶບ</button>
      </form>
    </div>
  </main>
</body>
</html>
